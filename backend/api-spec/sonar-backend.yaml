openapi: 3.0.1
info:
  title: sonar-backend
  description: New Backend for the old Application SonAbr
  version: 0.0.3-SNAPSHOT
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Actuator
  description: Monitor and interact
  externalDocs:
    description: Spring Boot Actuator Web API Documentation
    url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
paths:
  /theEntity/{theEntityId}:
    get:
      tags:
      - the-entity-controller
      summary: Retrieve an entity by its UUID.
      description: |-
        Retrieve an entity by its UUID.
         Fetches the entity details using the provided UUID.
      operationId: getTheEntity
      parameters:
      - name: theEntityId
        in: path
        description: the UUID of the requested entity
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: the entity with the given UID as a DTO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TheEntityResponseDTO"
      security:
      - bearerAuth: []
    put:
      tags:
      - the-entity-controller
      summary: Update an existing entity.
      description: |-
        Update an existing entity.
         Updates the details of an existing entity using the provided UUID and entity details.
      operationId: updateTheEntity
      parameters:
      - name: theEntityId
        in: path
        description: the UUID of the entity to update
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: the new details of the entity
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TheEntityRequestDTO"
        required: true
      responses:
        "200":
          description: the updated entity as a DTO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TheEntityResponseDTO"
      security:
      - bearerAuth: []
    delete:
      tags:
      - the-entity-controller
      summary: Delete an entity.
      description: |-
        Delete an entity.
         Deletes the entity using the provided UUID.
      operationId: deleteTheEntity
      parameters:
      - name: theEntityId
        in: path
        description: the UUID of the entity to delete
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      security:
      - bearerAuth: []
  /theEntity:
    get:
      tags:
      - the-entity-controller
      summary: Retrieve entities with pagination.
      description: |-
        Retrieve entities with pagination.
         Fetches a paginated list of entities based on the provided page number and size.
      operationId: getTheEntitiesByPageAndSize
      parameters:
      - name: pageNumber
        in: query
        description: "the number of the requested page (default: 0)"
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        description: "the size of the page to retrieve (default: 10)"
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: a page of entities represented as DTOs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedModelTheEntityResponseDTO"
      security:
      - bearerAuth: []
    post:
      tags:
      - the-entity-controller
      summary: Create a new entity.
      description: |-
        Create a new entity.
         Creates a new entity using the provided entity details.
      operationId: saveTheEntity
      requestBody:
        description: the details of the entity to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TheEntityRequestDTO"
        required: true
      responses:
        "201":
          description: the created entity as a DTO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TheEntityResponseDTO"
      security:
      - bearerAuth: []
  /projekt:
    get:
      tags:
      - projekt-controller
      summary: Retrieve Projekte with pagination.
      description: |-
        Retrieve Projekte with pagination.
         Fetches a paginated list of Projekte based on the provided page number and size.
         The optional search criteria are combined with AND and apply to the whole result, not just to
         the requested page. The same holds for the order, which is applied by the database.
      operationId: getProjekteByPageAndSize
      parameters:
      - name: pageNumber
        in: query
        description: "the number of the requested page (default: 0)"
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        description: "the size of the page to retrieve (default: 10, at most 100)"
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: projektnummer
        in: query
        description: "part of the Projektnummer to search for, case-insensitive"
        required: false
        schema:
          maxLength: 20
          minLength: 0
          type: string
      - name: abrechnungBeginn
        in: query
        description: the exact beginn of the billing period to search for
        required: false
        schema:
          type: string
          format: date
      - name: abrechnungEnde
        in: query
        description: the exact end of the billing period to search for
        required: false
        schema:
          type: string
          format: date
      - name: sortBy
        in: query
        description: "the column to order by (default: PROJEKTNUMMER)"
        required: false
        schema:
          type: string
          default: PROJEKTNUMMER
          enum:
          - PROJEKTNUMMER
          - ABRECHNUNG_BEGINN
          - ABRECHNUNG_ENDE
      - name: sortDirection
        in: query
        description: "the direction to order in (default: DESC)"
        required: false
        schema:
          type: string
          default: DESC
          enum:
          - ASC
          - DESC
      responses:
        "400":
          description: "the pagination, search or sort parameters are invalid"
        "200":
          description: a page of Projekte represented as DTOs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedModelProjektResponseDTO"
      security:
      - bearerAuth: []
    post:
      tags:
      - projekt-controller
      summary: Create a new Projekt.
      description: |-
        Create a new Projekt.
         Creates a new Projekt together with its Adressen in one call.
         Abrechnungsende must not be before Abrechnungsbeginn.
         An Adresse with a Hausnummer or a Flurstück with a Gemarkung is allowed, never both.
         Per Adresse, the period of unerlaubte Nutzung needs both dates or neither.
         Either that period or tageUnerlaubteNutzung is given, never both.
      operationId: saveProjekt
      requestBody:
        description: the details of the Projekt to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjektRequestDTO"
        required: true
      responses:
        "400":
          description: the details of the Projekt are invalid
        "201":
          description: the created Projekt as a DTO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjektResponseDTO"
      security:
      - bearerAuth: []
  /projekt/{projektId}/abrechnung:
    post:
      tags:
      - abrechnung-controller
      summary: Create a new Abrechnung for a Projekt.
      description: |-
        Create a new Abrechnung for a Projekt.
         Creates the Abrechnung in one call. The end of a Zeitraum must not be before its beginn.
         An Adresse with a Hausnummer or a Flurstück with a Gemarkung is allowed, never both.
      operationId: saveAbrechnung
      parameters:
      - name: projektId
        in: path
        description: the UUID of the Projekt the Abrechnung belongs to
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: the details of the Abrechnung to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbrechnungRequestDTO"
        required: true
      responses:
        "400":
          description: the details of the Abrechnung are invalid
        "404":
          description: the Projekt does not exist
        "201":
          description: the created Abrechnung as a DTO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbrechnungResponseDTO"
      security:
      - bearerAuth: []
  /projekt/{projektId}:
    get:
      tags:
      - projekt-controller
      summary: Retrieve a single Projekt.
      description: |-
        Retrieve a single Projekt.
         Fetches the Projekt together with its Adressen, in the order they were entered.
      operationId: getProjekt
      parameters:
      - name: projektId
        in: path
        description: the id of the requested Projekt
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: the Projekt does not exist
        "200":
          description: the Projekt represented as a DTO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjektResponseDTO"
      security:
      - bearerAuth: []
  /geschaeftspartner/{geschaeftspartnerId}:
    get:
      tags:
      - geschaeftspartner-controller
      summary: Retrieve the master data of a Geschäftspartner.
      description: |-
        Retrieve the master data of a Geschäftspartner.
         Retrieved data come from a third party system owning them.
      operationId: getGeschaeftspartner
      parameters:
      - name: geschaeftspartnerId
        in: path
        description: the id of the requested Geschäftspartner
        required: true
        schema:
          maxLength: 10
          minLength: 0
          type: string
      responses:
        "400":
          description: the id is longer than the owning system allows
        "404":
          description: the owning system does not know the id
        "502":
          description: the owning system could not be reached
        "200":
          description: the master data of the Geschäftspartner as a DTO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeschaeftspartnerResponseDTO"
      security:
      - bearerAuth: []
  /actuator:
    get:
      tags:
      - Actuator
      summary: Actuator root web endpoint
      operationId: links
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
  /actuator/sbom:
    get:
      tags:
      - Actuator
      summary: Actuator web endpoint 'sbom'
      operationId: sboms
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
  /actuator/sbom/{id}:
    get:
      tags:
      - Actuator
      summary: Actuator web endpoint 'sbom-id'
      operationId: sbom
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: object
        "404":
          description: Not Found
  /actuator/metrics:
    get:
      tags:
      - Actuator
      summary: Actuator web endpoint 'prometheus'
      operationId: scrape
      parameters:
      - name: format
        in: query
        schema:
          type: string
          enum:
          - CONTENT_TYPE_004
          - CONTENT_TYPE_OPENMETRICS_100
          - CONTENT_TYPE_PROTOBUF
      - name: includedNames
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/plain;version=0.0.4;charset=utf-8:
              schema:
                type: object
            application/openmetrics-text;version=1.0.0;charset=utf-8:
              schema:
                type: object
            application/vnd.google.protobuf;proto=io.prometheus.client.MetricFamily;encoding=delimited:
              schema:
                type: object
  /actuator/info:
    get:
      tags:
      - Actuator
      summary: Actuator web endpoint 'info'
      operationId: info
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
  /actuator/health:
    get:
      tags:
      - Actuator
      summary: Actuator web endpoint 'health'
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
components:
  schemas:
    TheEntityRequestDTO:
      required:
      - textAttribute
      type: object
      properties:
        textAttribute:
          maxLength: 8
          minLength: 2
          type: string
    TheEntityResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        textAttribute:
          type: string
    ProjektAdresseRequestDTO:
      required:
      - anzahlMahnungen
      - art
      type: object
      properties:
        art:
          type: string
          enum:
          - ADRESSE
          - FLURSTUECK
        adresse:
          maxLength: 255
          minLength: 1
          type: string
        hausnummerVon:
          maxLength: 20
          minLength: 1
          type: string
        hausnummerBis:
          maxLength: 20
          minLength: 1
          type: string
        flurstueck:
          maxLength: 255
          minLength: 1
          type: string
        gemarkung:
          maxLength: 255
          minLength: 1
          type: string
        nutzung:
          type: string
          enum:
          - NUTZUNG_A
          - NUTZUNG_B
          - NUTZUNG_C
        unerlaubteNutzungVon:
          type: string
          format: date
        unerlaubteNutzungBis:
          type: string
          format: date
        tageUnerlaubteNutzung:
          minimum: 1
          type: integer
          format: int32
        anzahlMahnungen:
          minimum: 0
          type: integer
          format: int32
        sondernutzungErlaubt:
          type: boolean
    ProjektRequestDTO:
      required:
      - abrechnungBeginn
      - abrechnungEnde
      - adressen
      - projektnummer
      type: object
      properties:
        projektnummer:
          maxLength: 20
          minLength: 1
          type: string
        abrechnungBeginn:
          type: string
          format: date
        abrechnungEnde:
          type: string
          format: date
        adressen:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProjektAdresseRequestDTO"
    ProjektAdresseResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        art:
          type: string
          enum:
          - ADRESSE
          - FLURSTUECK
        adresse:
          type: string
        hausnummerVon:
          type: string
        hausnummerBis:
          type: string
        flurstueck:
          type: string
        gemarkung:
          type: string
        nutzung:
          type: string
          enum:
          - NUTZUNG_A
          - NUTZUNG_B
          - NUTZUNG_C
        unerlaubteNutzungVon:
          type: string
          format: date
        unerlaubteNutzungBis:
          type: string
          format: date
        tageUnerlaubteNutzung:
          type: integer
          format: int32
        anzahlMahnungen:
          type: integer
          format: int32
        sondernutzungErlaubt:
          type: boolean
    ProjektResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projektnummer:
          type: string
        abrechnungBeginn:
          type: string
          format: date
        abrechnungEnde:
          type: string
          format: date
        adressen:
          type: array
          items:
            $ref: "#/components/schemas/ProjektAdresseResponseDTO"
    AbrechnungNutzungsobjektRequestDTO:
      required:
      - art
      - positionen
      type: object
      properties:
        art:
          type: string
          enum:
          - ADRESSE
          - FLURSTUECK
        adresse:
          maxLength: 255
          minLength: 1
          type: string
        hausnummerVon:
          maxLength: 20
          minLength: 1
          type: string
        hausnummerBis:
          maxLength: 20
          minLength: 1
          type: string
        flurstueck:
          maxLength: 255
          minLength: 1
          type: string
        gemarkung:
          maxLength: 255
          minLength: 1
          type: string
        nutzung:
          type: string
          enum:
          - NUTZUNG_A
          - NUTZUNG_B
          - NUTZUNG_C
        unerlaubteNutzungVon:
          type: string
          format: date
        unerlaubteNutzungBis:
          type: string
          format: date
        tageUnerlaubteNutzung:
          minimum: 1
          type: integer
          format: int32
        bemerkung:
          maxLength: 10000
          minLength: 0
          type: string
        positionen:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/AbrechnungPositionRequestDTO"
    AbrechnungPositionRequestDTO:
      required:
      - anteilAnFlaeche
      - beginn
      - breite
      - ende
      - flaeche
      - laenge
      type: object
      properties:
        beginn:
          type: string
          format: date
        ende:
          type: string
          format: date
        laenge:
          minimum: 0
          exclusiveMinimum: true
          type: number
        breite:
          minimum: 0
          exclusiveMinimum: true
          type: number
        flaeche:
          minimum: 0
          exclusiveMinimum: true
          type: number
        haelfte:
          type: boolean
        anteilAnFlaeche:
          minimum: 0
          exclusiveMinimum: false
          type: number
    AbrechnungRequestDTO:
      required:
      - abrechnungsArt
      - geschaeftspartnerId
      - nutzungsobjekte
      - zeitraumBis
      - zeitraumVon
      type: object
      properties:
        geschaeftspartnerId:
          maxLength: 10
          minLength: 1
          type: string
        zustellungsbevollmaechtigterGenutzt:
          type: boolean
        zustellungsbevollmaechtigterId:
          maxLength: 10
          minLength: 1
          type: string
        zustellungsbevollmaechtigterTyp:
          type: string
          enum:
          - GESETZLICHER_VERTRETER
          - VORMUND
          - BETREUER
          - NACHLASSVERWALTER
          - NACHLASSPFLEGER
          - TESTAMENTSVOLLSTRECKER
          - ZWANGSVERWALTER
          - PFLEGER
          - VORSTAND
          - GESCHAEFTSFUEHRENDER_GESELLSCHAFTER
          - LIQUIDATOR
          - KONKURSVERWALTER
          - STEUERLICHER_VERTRETER
          - EMPFANGSBEVOLLMAECHTIGTER
          - VERGLEICHSVERWALTER
          - GESAMTRECHTSNACHFOLGER
          - VERWALTER_NACH_DEM_WEG
          - GESCHAEFTSFUEHRER
          - GESELLSCHAFTER
          - INSOLVENZVERWALTER
          - NACHTRAGSLIQUIDATOR
          - TREUHAENDER
          - VORLAEUFIGER_INSOLVENZVERWALTER
        zeitraumVon:
          type: string
          format: date
        zeitraumBis:
          type: string
          format: date
        abrechnungsArt:
          type: string
          enum:
          - ENDABRECHNUNG
          - ZWISCHENABRECHNUNG
        nutzungsobjekte:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/AbrechnungNutzungsobjektRequestDTO"
      description: |-
        The Abrechnung to create.
         <p>
         An Abrechnung is created below its Projekt, so the path decides which one it belongs to.
         </p>
    AbrechnungNutzungsobjektResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        art:
          type: string
          enum:
          - ADRESSE
          - FLURSTUECK
        adresse:
          type: string
        hausnummerVon:
          type: string
        hausnummerBis:
          type: string
        flurstueck:
          type: string
        gemarkung:
          type: string
        nutzung:
          type: string
          enum:
          - NUTZUNG_A
          - NUTZUNG_B
          - NUTZUNG_C
        unerlaubteNutzungVon:
          type: string
          format: date
        unerlaubteNutzungBis:
          type: string
          format: date
        tageUnerlaubteNutzung:
          type: integer
          format: int32
        bemerkung:
          type: string
        positionen:
          type: array
          items:
            $ref: "#/components/schemas/AbrechnungPositionResponseDTO"
    AbrechnungPositionResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        beginn:
          type: string
          format: date
        ende:
          type: string
          format: date
        laenge:
          type: number
        breite:
          type: number
        flaeche:
          type: number
        haelfte:
          type: boolean
        anteilAnFlaeche:
          type: number
    AbrechnungResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projektId:
          type: string
          format: uuid
        geschaeftspartnerId:
          type: string
        zustellungsbevollmaechtigterGenutzt:
          type: boolean
        zustellungsbevollmaechtigterId:
          type: string
        zustellungsbevollmaechtigterTyp:
          type: string
          enum:
          - GESETZLICHER_VERTRETER
          - VORMUND
          - BETREUER
          - NACHLASSVERWALTER
          - NACHLASSPFLEGER
          - TESTAMENTSVOLLSTRECKER
          - ZWANGSVERWALTER
          - PFLEGER
          - VORSTAND
          - GESCHAEFTSFUEHRENDER_GESELLSCHAFTER
          - LIQUIDATOR
          - KONKURSVERWALTER
          - STEUERLICHER_VERTRETER
          - EMPFANGSBEVOLLMAECHTIGTER
          - VERGLEICHSVERWALTER
          - GESAMTRECHTSNACHFOLGER
          - VERWALTER_NACH_DEM_WEG
          - GESCHAEFTSFUEHRER
          - GESELLSCHAFTER
          - INSOLVENZVERWALTER
          - NACHTRAGSLIQUIDATOR
          - TREUHAENDER
          - VORLAEUFIGER_INSOLVENZVERWALTER
        zeitraumVon:
          type: string
          format: date
        zeitraumBis:
          type: string
          format: date
        abrechnungsArt:
          type: string
          enum:
          - ENDABRECHNUNG
          - ZWISCHENABRECHNUNG
        nutzungsobjekte:
          type: array
          items:
            $ref: "#/components/schemas/AbrechnungNutzungsobjektResponseDTO"
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PagedModelTheEntityResponseDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/TheEntityResponseDTO"
        page:
          $ref: "#/components/schemas/PageMetadata"
    PagedModelProjektResponseDTO:
      type: object
      properties:
        content:
