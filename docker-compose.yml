# Runs the application (backend + frontend) as *dev* containers and wires them
# into the already-running "./stack" services (postgres, keycloak, gateway, ...).
# Source is bind-mounted, so code changes are picked up without rebuilding the
# image (restart the backend container to recompile). Both containers run as a
# non-root user built with *your* uid/gid, so everything they write into the bind
# mounts (backend/target, frontend/dist, generated sources) stays yours.
#
# 1) Start the stack first (creates the networks referenced below):
#        docker compose -f stack/docker-compose.yml up -d
# 2) Start the app. UID is a shell builtin and is not exported, so pass both
#    explicitly (or put UID= and GID= into a .env file next to this one):
#        UID=1001 GID=1001 docker compose up --build
#    Without them the build falls back to 1000:1000, which only works if that
#    happens to be your account.
# 3) Open the app through the gateway:  http://localhost:8083
#    Attach a JVM debugger to:          localhost:5005

name: sonar-app

services:
  backend:
    build:
      context: ./backend
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
      dockerfile_inline: |
        FROM maven:3.9-eclipse-temurin-21@sha256:2b4496088e7b80ae10a8c9f74e574ea21380325a006ec684532ad6bad5bc7273
        ARG UID
        ARG GID
        ENV MAVEN_CONFIG=/home/app/.m2
        RUN groupadd -g $${GID} app \
            && useradd -u $${UID} -g $${GID} -m -d /home/app app \
            && mkdir -p /app /home/app/.m2 \
            && chown -R app:app /app /home/app
        USER app
        WORKDIR /app
    # Mirrors runLocal.sh, plus a JDWP agent so a debugger can attach on :5005.
    command:
      - mvn
      - clean
      - spring-boot:run
      - -Dspring-boot.run.jvmArguments=-Dspring.profiles.active=local -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    environment:
      # The "local" profile points the datasource at localhost, which inside the
      # container is the container itself. Only the host changes here, username
      # and password stay in the profile.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
    ports:
      - "8086:8086"
      - "127.0.0.1:5005:5005" # Debugger
    volumes:
      - ./backend:/app
      - backend-m2:/home/app/.m2
    networks:
      - stack-default
      - stack-keycloak

  frontend:
    build:
      context: ./frontend
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
      dockerfile_inline: |
        FROM node:24.18-bookworm-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
        ARG UID
        ARG GID
        RUN apt-get update \
            && apt-get install -y --no-install-recommends default-jre-headless=2:1.17-74 \
            && rm -rf /var/lib/apt/lists/*
        RUN npm install -g npm@11.16.0
        # The base image ships a "node" account on 1000:1000, so drop it first in
        # case that is exactly the uid/gid being asked for. Failing to remove it
        # is not fatal: all that matters is that the ids below are free.
        RUN (userdel -r node || true) \
            && groupadd -g $${GID} app \
            && useradd -u $${UID} -g $${GID} -m -d /home/app app \
            && mkdir -p /app/node_modules \
            && chown -R app:app /app /home/app
        USER app
        WORKDIR /app
    command: sh -c "npm ci --ignore-scripts && npm run pre-build && npm run dev"
    ports:
      - "8081:8081"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - ./backend/api-spec:/backend/api-spec:ro
    networks:
      - stack-default

# Created by the stack (compose project "refarch-stack"); referenced as external
# so this file never modifies the stack definition.
networks:
  stack-default:
    name: refarch-stack_default
    external: true
  stack-keycloak:
    name: refarch-stack_keycloak
    external: true

volumes:
  backend-m2:
  frontend-node-modules:
