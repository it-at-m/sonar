id: add sachbearbeiter roles and users
author: Default
realm: local_realm
changes:
  - addRole:
      name: SB_Nord
      clientRole: true
      clientId: local
      composite: false

  - addRole:
      name: SB_Mitte
      clientRole: true
      clientId: local
      composite: false

  - addRole:
      name: SB_Sued
      clientRole: true
      clientId: local
      composite: false

  - addRole:
      name: SB_West
      clientRole: true
      clientId: local
      composite: false

  - addRole:
      name: SB_Ost
      clientRole: true
      clientId: local
      composite: false

  - addUser:
      name: sb_nord
      lastName: sb_nord
      firstName: sb_nord
      enabled: true
      emailVerified: true
      email: sb_nord.notexist@muenchen.de
  - updateUserPassword:
      name: sb_nord
      password: "sb_nord"
  - assignRole:
      user: sb_nord
      role: SB_Nord
      clientId: local

  - addUser:
      name: sb_mitte_sued
      lastName: sb_mitte_sued
      firstName: sb_mitte_sued
      enabled: true
      emailVerified: true
      email: sb_mitte_sued.notexist@muenchen.de
  - updateUserPassword:
      name: sb_mitte_sued
      password: "sb_mitte_sued"
  - assignRole:
      user: sb_mitte_sued
      role: SB_Mitte
      clientId: local
  - assignRole:
      user: sb_mitte_sued
      role: SB_Sued
      clientId: local
